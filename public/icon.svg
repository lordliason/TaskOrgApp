<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <line x1="96" y1="256" x2="416" y2="256" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <!-- Quadrant indicators -->
  <!-- Do First (top-left) - filled circle -->
  <circle cx="176" cy="176" r="32" fill="#ef4444"/>
  <!-- Schedule (top-right) - ring -->
  <circle cx="336" cy="176" r="32" fill="none" stroke="#f59e0b" stroke-width="8"/>
  <!-- Delegate (bottom-left) - square -->
  <rect x="152" y="320" width="48" height="48" rx="8" fill="#22c55e"/>
  <!-- Eliminate (bottom-right) - crossed out -->
  <circle cx="336" cy="344" r="24" fill="none" stroke="#64748b" stroke-width="6"/>
  <line x1="319" y1="327" x2="353" y2="361" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
</svg>
