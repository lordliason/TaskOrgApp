<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="metallic1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb"/>
      <stop offset="50%" style="stop-color:#9ca3af"/>
      <stop offset="100%" style="stop-color:#d1d5db"/>
    </linearGradient>
    <linearGradient id="metallic2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6"/>
      <stop offset="50%" style="stop-color:#d1d5db"/>
      <stop offset="100%" style="stop-color:#e5e7eb"/>
    </linearGradient>
  </defs>

  <!-- Background - Dark -->
  <rect width="512" height="512" rx="128" fill="#1a1a1a"/>

  <!-- Grid of squares representing task matrix -->
  <!-- Top-left: outlined square (white) -->
  <rect x="140" y="140" width="88" height="88" rx="16" fill="none" stroke="#ffffff" stroke-width="12"/>

  <!-- Top-right: filled square (metallic) -->
  <rect x="284" y="140" width="88" height="88" rx="16" fill="url(#metallic2)"/>

  <!-- Bottom-left: filled square (metallic) -->
  <rect x="140" y="284" width="88" height="88" rx="16" fill="url(#metallic1)"/>

  <!-- Bottom-right: outlined square (white, smaller) -->
  <rect x="296" y="296" width="64" height="64" rx="12" fill="none" stroke="#ffffff" stroke-width="10"/>
</svg>
